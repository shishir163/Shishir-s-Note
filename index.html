  :root{
    color-scheme:light;
    --canvas:#f4f5f9;
    --surface:#ffffff;
    --surface-2:#fafbff;
    --ink:#23252f;
    --ink-soft:#6b6f80;
    --line:#e6e8f0;
    --accent:#6d48e5;
    --accent-2:#a855f7;
    --accent-soft:#efe9fe;
    --danger:#e5484d;
    --danger-soft:#fbe3e4;
    --ok:#12a594;
    --radius:16px;
    --shadow:0 1px 2px rgba(30,25,60,.06), 0 8px 24px rgba(30,25,60,.06);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--canvas);color:var(--ink);
    font-size:15px;line-height:1.5;
    overscroll-behavior:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px}
  ::selection{background:var(--accent-soft)}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:40;background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:10px 14px calc(10px);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .logo{
    width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;
  }
  .brand h1{font-size:19px;font-weight:750;margin:0;letter-spacing:-.2px}
  .brand .count{margin-left:auto;font-size:12.5px;color:var(--ink-soft)}
  .searchrow{display:flex;gap:8px;align-items:center}
  .search{
    flex:1;display:flex;align-items:center;gap:8px;background:var(--canvas);
    border:1px solid var(--line);border-radius:12px;padding:9px 12px;
  }
  .search input{border:none;background:none;outline:none;width:100%;color:var(--ink)}
  .search svg{flex:0 0 auto;color:var(--ink-soft)}
  .iconbtn{
    width:40px;height:40px;border-radius:12px;background:var(--canvas);
    border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-soft);flex:0 0 auto;
  }
  .iconbtn.active{background:var(--accent-soft);color:var(--accent);border-color:transparent}

  /* ---------- Filter chips ---------- */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-soft);
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .chip .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .chip.on{background:var(--accent);color:#fff;border-color:transparent}
  .chip.tagchip.on{color:#fff}
  .chip .x{margin-left:2px;opacity:.7;font-weight:700}

  /* ---------- Notes area ---------- */
  main{padding:6px 14px 120px}
  .sectlabel{font-size:12px;color:var(--ink-soft);font-weight:700;margin:14px 2px 8px;letter-spacing:.3px}
  #notes.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  #notes.list{display:flex;flex-direction:column;gap:10px}

  .card{
    background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);
    border-radius:14px;padding:13px 13px 12px;box-shadow:var(--shadow);
    position:relative;overflow:hidden;
  }
  .card .top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
  .card h3{font-size:15px;font-weight:700;margin:0;flex:1;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .card .pinbtn{color:var(--ink-soft);flex:0 0 auto;padding:0;margin:-2px -2px 0 0}
  .card .pinbtn.on{color:var(--accent)}
  .card .preview{font-size:13px;color:var(--ink-soft);
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

  .titlein{width:100%;border:none;background:none;outline:none;font-size:22px;font-weight:750;

  /* toolbar for rich text */
  .toolbar{
    display:flex;gap:6px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5;

  }
  .toolbar button, .toolbar label{
    min-width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);

  .toolbar select{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 6px;color:var(--ink)}

  .rte{

  /* checklist editor */
  .items{display:flex;flex-direction:column;gap:8px;margin-top:6px}

  .rcard h4{margin:0 0 6px;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rcard p{margin:0;font-size:12px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .dash-empty{color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}

  /* ---------- Calculator ---------- */
  .calc-wrap{flex:1;display:flex;flex-direction:column;padding:14px 14px calc(14px + var(--safe-b));gap:14px}
  .calc-display{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;box-shadow:var(--shadow)}
  .calc-expr{font-size:18px;color:var(--ink-soft);min-height:22px;word-break:break-all;text-align:right}
  .calc-res{font-size:42px;font-weight:800;letter-spacing:-.5px;margin-top:8px;word-break:break-all;text-align:right;line-height:1.05}
  .calc-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:10px;min-height:0}
  .calc-keys button{border-radius:18px;font-size:23px;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .06s}
  .calc-keys button.op{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:800}

<script>
"use strict";

/* =========================================================
   Storage layer — IndexedDB with in-memory fallback.
   (In-memory keeps the app usable inside sandboxes that
    block IndexedDB; on GitHub Pages IndexedDB persists.)
========================================================= */
const DB = (() => {
  const NAME = 'noteApp', VER = 2, STORES = ['notes','folders','tags','settings'];
  let db = null, mem = {notes:[],folders:[],tags:[]}, useMem = false;

  function open(){
    return new Promise((res)=>{
      let idb;
      try { idb = window.indexedDB; } catch(e){ idb = null; }
      if(!idb){ useMem = true; return res(); }
      let req;
      try { req = idb.open(NAME, VER); } catch(e){ useMem = true; return res(); }
      req.onupgradeneeded = e => {
        const d = e.target.result;
        STORES.forEach(s => { if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'}); });
      };
      req.onsuccess = e => { db = e.target.result; res(); };
      req.onerror = () => { useMem = true; res(); };
    });
  }
  function all(store){
    if(useMem) return Promise.resolve(mem[store].slice());
    return new Promise((res)=>{
      try{
        const tx = db.transaction(store,'readonly').objectStore(store).getAll();
        tx.onsuccess = ()=>res(tx.result||[]);
        tx.onerror = ()=>res([]);
      }catch(e){res([])}
    });
  }
  function put(store,obj){
    if(useMem){ const a=mem[store]; const i=a.findIndex(x=>x.id===obj.id); if(i>=0)a[i]=obj;else a.push(obj); return Promise.resolve(); }
    return new Promise((res)=>{ try{ const tx=db.transaction(store,'readwrite').objectStore(store).put(obj); tx.onsuccess=()=>res(); tx.onerror=()=>res(); }catch(e){res()} });
  }
  function del(store,id){
    if(useMem){ mem[store]=mem[store].filter(x=>x.id!==id); return Promise.resolve(); }
    return new Promise((res)=>{ try{ const tx=db.transaction(store,'readwrite').objectStore(store).delete(id); tx.onsuccess=()=>res(); tx.onerror=()=>res(); }catch(e){res()} });
  }
  return {open,all,put,del,isMem:()=>useMem};
})();

/* =========================================================
   State
========================================================= */
let notes=[], folders=[], tags=[];
let view = 'grid';               // grid | list
let filter = {kind:'active', tagId:null, folderId:null}; // active|pinned|archived|trash
let searchQ = '';

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
const now = () => Date.now();
const $ = s => document.querySelector(s);
const el = (t,c)=>{const e=document.createElement(t); if(c)e.className=c; return e;};

const TAG_COLORS = ['#6d48e5','#e5484d','#f5a623','#12a594','#3b82f6','#ec4899','#8b5cf6','#059669','#f97316','#0ea5e9'];
const NOTE_COLORS = ['#6d48e5','#12a594','#f5a623','#e5484d','#3b82f6','#ec4899','#64748b','#059669'];

function SHEET_DEFAULT_COLUMNS(){ return [{id:'c_desc',name:'Description',type:'text'},{id:'c_amt',name:'Amount',type:'number'}]; }
function ensureSheetSchema(n){
  if(!n || n.type!=='sheet') return;
  if(!n.columns || !n.columns.length){
    n.columns = SHEET_DEFAULT_COLUMNS();
    (n.items||[]).forEach(it=>{
      if(!it.cells){ it.cells = { c_desc: it.text||'', c_amt: it.amount||'' }; delete it.text; delete it.amount; }
    });
  } else {
    (n.items||[]).forEach(it=>{ if(!it.cells) it.cells={}; });
  }
}

/* =========================================================
   Boot
========================================================= */
async function boot(){
  await DB.open();
  [notes,folders,tags] = await Promise.all([DB.all('notes'),DB.all('folders'),DB.all('tags')]);
  const s=(await DB.all('settings'))[0];
  if(s){ settings.theme=s.theme||'violet'; settings.mode=s.mode||'light'; view=s.view||'grid'; settings.driveClientId=s.driveClientId||''; }
  applyTheme();
  $('#viewtoggle').classList.toggle('active',view==='list');
  await purgeOldTrash();
  render();
  if(DB.isMem()) toast('Preview mode — data saves for real on your site');
}

async function purgeOldTrash(){
  const cutoff = now() - 30*24*3600*1000;
  const doomed = notes.filter(n=>n.deletedAt && n.deletedAt < cutoff);
  for(const n of doomed){ await DB.del('notes',n.id); }
  if(doomed.length) notes = notes.filter(n=>!(n.deletedAt && n.deletedAt < cutoff));
}

/* =========================================================
   Rendering — chips + notes
========================================================= */
function tagById(id){return tags.find(t=>t.id===id)}
function folderById(id){return folders.find(f=>f.id===id)}

function render(){
  renderChips();
  renderNotes();
  if(currentTab==='dash') renderDashboard();
}

function renderChips(){
  const wrap = $('#chips'); wrap.innerHTML='';
  const kinds = [['active','All'],['pinned','Pinned'],['archived','Archived'],['trash','Trash']];
  kinds.forEach(([k,label])=>{
    const c = el('button','chip'+(filter.kind===k?' on':''));
    c.textContent = label;
    if(k==='trash'){ const n=notes.filter(x=>x.deletedAt).length; if(n) c.textContent=label+' ('+n+')'; }
    c.onclick=()=>{filter.kind=k; render();};
    wrap.appendChild(c);
  });
  // folder filter
  if(filter.folderId){
    const f=folderById(filter.folderId);
    const c=el('button','chip on'); c.innerHTML='📁 '+(f?f.name:'?')+' <span class="x">×</span>';
    c.onclick=()=>{filter.folderId=null;render();}; wrap.appendChild(c);
  }
  // tag chips
  tags.forEach(t=>{
    const on = filter.tagId===t.id;
    const c=el('button','chip tagchip'+(on?' on':''));
    if(on) c.style.background=t.color;
    c.innerHTML = '<span class="dot" style="background:'+t.color+'"></span>'+t.name+(on?' <span class="x">×</span>':'');
    c.onclick=()=>{filter.tagId = on?null:t.id; render();};
    wrap.appendChild(c);
  });
}

function matchesFilter(n){
  if(filter.kind==='trash') return !!n.deletedAt;
  if(n.deletedAt) return false;
  if(filter.kind==='archived' && !n.archived) return false;
  if(filter.kind!=='archived' && n.archived) return false;
  if(filter.kind==='pinned' && !n.pinned) return false;
  if(filter.folderId && n.folderId!==filter.folderId) return false;
  if(filter.tagId && !(n.tags||[]).includes(filter.tagId)) return false;
  if(searchQ){
    const q=searchQ.toLowerCase();
    const tagNames=(n.tags||[]).map(id=>{const t=tagById(id);return t?t.name.toLowerCase():''}).join(' ');
    const itemText=(n.items||[]).map(i=> i.cells ? Object.values(i.cells).join(' ') : (i.text+' '+(i.qty||'')) ).join(' ').toLowerCase();
    const body=(n.content||'').replace(/<[^>]+>/g,' ').toLowerCase();
    if(!((n.title||'').toLowerCase().includes(q) || body.includes(q) || tagNames.includes(q) || itemText.includes(q))) return false;
  }
  return true;
}

function renderNotes(){
  const box=$('#notes'), empty=$('#empty');
  box.className = view==='grid'?'grid':'list';
  let list = notes.filter(matchesFilter);
  list.sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || (b.updatedAt||0)-(a.updatedAt||0));
  box.innerHTML='';
  if(!list.length){ box.classList.add('hidden'); empty.classList.remove('hidden'); renderEmpty(empty); return; }
  box.classList.remove('hidden'); empty.classList.add('hidden');
  list.forEach(n=>box.appendChild(card(n)));
}

function renderEmpty(e){
  let big='📝', msg='<b>No notes yet</b>', sub='Tap + to add your first one.';
  if(searchQ){ big='🔍'; msg='<b>Nothing found</b>'; sub='Try another word.'; }
  else if(filter.kind==='pinned'){ big='📌'; msg='<b>No pinned notes</b>'; sub='Pin a note to keep it on top.'; }
  else if(filter.kind==='archived'){ big='🗂️'; msg='<b>Archive is empty</b>'; sub='Archived notes rest here, out of the way.'; }
  else if(filter.kind==='trash'){ big='🗑️'; msg='<b>Trash is empty</b>'; sub='Deleted notes stay 30 days, then clear.'; }
  else if(filter.tagId||filter.folderId){ big='🫙'; msg='<b>Nothing here yet</b>'; sub='No notes match this filter.'; }
  e.innerHTML='<div class="big">'+big+'</div><p>'+msg+'</p><p>'+sub+'</p>';
}

function typeBadge(t){
  if(t==='checklist') return '<span class="typeicon">✓ list</span>';
  if(t==='task') return '<span class="typeicon">☀ task</span>';
  if(t==='sheet') return '<span class="typeicon">▦ sheet</span>';
  return '<span class="typeicon">✎ note</span>';
}

function card(n){
  const c=el('div','card'+(n.pinned?' pinnedcard':''));
  c.style.borderLeftColor = n.color||'var(--accent)';

  const top=el('div','top');
  const h=el('h3'); h.textContent=n.title||'Untitled';
  top.appendChild(h);
  if(!n.deletedAt){
    const pin=el('button','pinbtn'+(n.pinned?' on':''));
    pin.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="'+(n.pinned?'currentColor':'none')+'" stroke="currentColor" stroke-width="2"><path d="M12 17v5M9 3h6l-1 7 3 3H7l3-3-1-7z"/></svg>';
    pin.onclick=e=>{e.stopPropagation(); n.pinned=!n.pinned; n.updatedAt=now(); DB.put('notes',n); render();};
    top.appendChild(pin);
  }
  c.appendChild(top);

  if(n.type==='text'){
    const p=el('div','preview'); p.innerHTML = n.content || '<span style="opacity:.5">Empty note</span>';
    c.appendChild(p);
  } else if(n.type==='sheet'){
    ensureSheetSchema(n);
    const textCol=n.columns.find(cl=>cl.type==='text')||n.columns[0];
    const numCol=n.columns.find(cl=>cl.type==='number');
    const ul=el('ul','mini'); const items=(n.items||[]).slice(0,4);
    if(!items.length){ const li=el('li'); li.innerHTML='<span style="opacity:.5">Empty sheet</span>'; ul.appendChild(li); }
    items.forEach(it=>{
      const label=(it.cells&&textCol&&it.cells[textCol.id])||'(no description)';
      let right='';
      if(numCol){
        const amt=parseFloat(it.cells&&it.cells[numCol.id])||0;
        right='<span style="margin-left:auto;font-weight:700;color:'+(amt<0?'var(--danger)':'var(--accent)')+'">'+(amt<0?'−':'')+'৳ '+formatMoney(Math.abs(amt))+'</span>';
      }
      const li=el('li'); li.style.display='flex';
      li.innerHTML='<span>'+escapeHtml(String(label))+'</span>'+right;
      ul.appendChild(li);
    });
    const more=(n.items||[]).length-4;
    if(more>0){ const li=el('li'); li.textContent='+'+more+' more rows'; ul.appendChild(li); }
    c.appendChild(ul);
  } else {
    const ul=el('ul','mini'); const items=(n.items||[]).slice(0,4);
    if(!items.length){ const li=el('li'); li.innerHTML='<span style="opacity:.5">Empty list</span>'; ul.appendChild(li); }
    items.forEach(it=>{
      const li=el('li',it.done?'done':'');
      li.innerHTML='<span class="box'+(it.done?' done':'')+'"></span><span>'+escapeHtml(it.text||'')+(it.qty?' · '+escapeHtml(it.qty):'')+'</span>';
      ul.appendChild(li);
    });
    const more=(n.items||[]).length-4;
    if(more>0){ const li=el('li'); li.textContent='+'+more+' more'; ul.appendChild(li); }
    c.appendChild(ul);
  }

  const meta=el('div','meta');
  meta.innerHTML = typeBadge(n.type);
  if(n.type==='checklist'){ const tot=(n.items||[]).reduce((s,it)=>s+(parseFloat(it.price)||0),0); if(tot>0){ const s=el('span','foldertag'); s.style.fontWeight='700'; s.style.color='var(--accent)'; s.textContent='৳ '+formatMoney(tot); meta.appendChild(s); } }
  if(n.type==='sheet'){ const numCol=n.columns&&n.columns.find(cl=>cl.type==='number'); if(numCol){ const tot=(n.items||[]).reduce((s,it)=>s+(parseFloat(it.cells&&it.cells[numCol.id])||0),0); if(tot!==0){ const s=el('span','foldertag'); s.style.fontWeight='700'; s.style.color= tot<0?'var(--danger)':'var(--accent)'; s.textContent=(tot<0?'−':'')+'৳ '+formatMoney(Math.abs(tot)); meta.appendChild(s); } } }
  if(n.folderId){ const f=folderById(n.folderId); if(f){const s=el('span','foldertag');s.textContent='📁 '+f.name;meta.appendChild(s);} }
  (n.tags||[]).forEach(id=>{const t=tagById(id); if(t){const p=el('span','tagpill');p.style.background=t.color;p.textContent=t.name;meta.appendChild(p);}});
  c.appendChild(meta);

  if(n.deletedAt){
    const acts=el('div','trashacts');
    const r=el('button','restore'); r.textContent='Restore';
    r.onclick=e=>{e.stopPropagation(); n.deletedAt=null; n.updatedAt=now(); DB.put('notes',n); render(); toast('Restored');};
    const p=el('button','purge'); p.textContent='Delete forever';
    p.onclick=async e=>{e.stopPropagation(); await DB.del('notes',n.id); notes=notes.filter(x=>x.id!==n.id); render(); toast('Deleted forever');};
    acts.appendChild(r); acts.appendChild(p); c.appendChild(acts);
  } else {
    c.onclick=()=>openEditor(n.id);
  }
  return c;
}

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function buildToolbar(){
  const tb=el('div','toolbar');
  try{document.execCommand('styleWithCSS',false,true);}catch(e){}
  const exec=(cmd,val)=>{document.execCommand(cmd,false,val||null); const r=$('#rte'); if(r){r.focus(); editing.content=r.innerHTML; scheduleSave();} syncToolbar();};

  const mkBtn=(label,cls,cmd)=>{const b=el('button',cls);b.innerHTML=label;b.dataset.cmd=cmd;b.onmousedown=e=>e.preventDefault();b.onclick=()=>exec(cmd);return b;};
  tb.appendChild(mkBtn('B','b','bold'));
  tb.appendChild(mkBtn('I','i','italic'));
  tb.appendChild(mkBtn('U','u','underline'));

  const font=el('select'); font.title='Font';
  [['','Default'],['"Lato",sans-serif','Lato'],['Georgia,serif','Serif'],['"Courier New",monospace','Mono'],['"Comic Sans MS",cursive','Casual'],['Impact,sans-serif','Bold face']].forEach(([v,l])=>{const o=el('option');o.value=v;o.textContent=l;font.appendChild(o);});
  font.onchange=()=>exec('fontName',font.value);
  tb.appendChild(font);

  const size=el('select'); size.title='Size';
  [['3','Normal'],['1','Small'],['5','Large'],['7','Huge']].forEach(([v,l])=>{const o=el('option');o.value=v;o.textContent=l;size.appendChild(o);});
  size.onchange=()=>exec('fontSize',size.value);

  const hi=el('label','colorwrap'); hi.title='Highlight';
  hi.innerHTML='<span style="background:#ffe58a;padding:0 3px;border-radius:3px">▨</span><input type="color" value="#ffe58a">';
  hi.querySelector('input').oninput=e=>exec('hiliteColor',e.target.value);
  tb.appendChild(hi);

  document.addEventListener('selectionchange',syncToolbar);
  return tb;
}
function syncToolbar(){
  const tb=document.querySelector('.toolbar'); if(!tb)return;
  ['bold','italic','underline'].forEach(cmd=>{
    const b=tb.querySelector('[data-cmd="'+cmd+'"]'); if(!b)return;
    let on=false; try{on=document.queryCommandState(cmd);}catch(e){}
    b.classList.toggle('on',on);
  });
  const rte=document.getElementById('rte');
  if(rte){ const sel=window.getSelection(); if(sel&&sel.rangeCount&&rte.contains(sel.anchorNode)) savedSel=sel.getRangeAt(0).cloneRange(); }
}

function buildItems(){
  const wrap=el('div');
  const list=el('div','items'); list.id='itemlist';
  drawItems(list);
  wrap.appendChild(list);
  const add=el('button','additem');
  add.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Add item';
  add.onclick=()=>{editing.items=editing.items||[]; editing.items.push({text:'',qty:'',price:'',done:false}); scheduleSave(); drawItems(list); const inputs=list.querySelectorAll('input.txt'); inputs[inputs.length-1].focus();};
  wrap.appendChild(add);
  return wrap;
}
function computeTotal(){ return (editing.items||[]).reduce((s,it)=>s+(parseFloat(it.price)||0),0); }
function formatMoney(n){ const r=Math.round(n*100)/100; return (r%1===0? String(r) : r.toFixed(2)); }
function refreshTotal(list){
  const has=(editing.items||[]).some(it=>it.price!=null && String(it.price).trim()!=='' && !isNaN(parseFloat(it.price)));
  let bar=list.querySelector('.item-total');
  if(!has){ if(bar) bar.remove(); return; }
  if(!bar){ bar=el('div','item-total'); bar.innerHTML='<span>Total</span><span class="amt"></span>'; list.appendChild(bar); }
  bar.querySelector('.amt').textContent='৳ '+formatMoney(computeTotal());
}
function drawItems(list){
  list.innerHTML='';
  const isCheck = editing.type==='checklist';
  (editing.items||[]).forEach((it,idx)=>{
    const row=el('div','item'+(isCheck?' citem':'')+(it.done?' done':''));
    const cb=el('button','cb'+(it.done?' done':''));
    cb.innerHTML=it.done?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>':'';
    cb.onclick=()=>{it.done=!it.done; scheduleSave(); drawItems(list);};
    const txt=el('input','txt'); txt.value=it.text||''; txt.placeholder='Item';
    txt.oninput=()=>{it.text=txt.value; scheduleSave();};
    txt.onfocus=()=>{lastItemField=txt;};
    txt.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault(); editing.items.splice(idx+1,0,{text:'',qty:'',price:'',done:false}); scheduleSave(); drawItems(list); const inps=list.querySelectorAll('input.txt'); if(inps[idx+1])inps[idx+1].focus();}};
    const qty=el('input','qty'); qty.value=it.qty||''; qty.placeholder='Qty';
    qty.oninput=()=>{it.qty=qty.value; scheduleSave();};
    qty.onfocus=()=>{lastItemField=qty;};
    const del=el('button','del'); del.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
    del.onclick=()=>{editing.items.splice(idx,1); scheduleSave(); drawItems(list);};

    if(isCheck){
      const top=el('div','citem-top'); top.appendChild(cb); top.appendChild(txt); top.appendChild(del);
      const sub=el('div','citem-sub');
      qty.className='subfield';
      const price=el('input','subfield price'); price.value=(it.price||''); price.placeholder='৳ Price'; price.inputMode='decimal';
      price.oninput=()=>{it.price=price.value; scheduleSave(); refreshTotal(list);};
      price.onfocus=()=>{lastItemField=price;};
      sub.appendChild(qty); sub.appendChild(price);
      row.appendChild(top); row.appendChild(sub);
    } else {
      row.appendChild(cb); row.appendChild(txt); row.appendChild(qty); row.appendChild(del);
    }
    list.appendChild(row);
  });
  if(isCheck) refreshTotal(list);
}

/* =========================================================
   Sheet — fully custom columns, side-scroll table (Excel style).
   Number columns: type "-500" to subtract, plain "500" to add.
   Leftmost handle column (row delete) and the header "+" (add
   column) stay pinned while the rest of the table scrolls sideways.
========================================================= */
function updateSheetTotals(table){
  const n=editing; if(!n || !n.columns) return;
  n.columns.forEach(col=>{
    if(col.type!=='number') return;
    const cell=table.querySelector('.totalrow[data-col="'+col.id+'"]');
    if(!cell) return;
    const tot=(n.items||[]).reduce((s,it)=>s+(parseFloat(it.cells&&it.cells[col.id])||0),0);
    cell.innerHTML='<b style="color:'+(tot<0?'var(--danger)':'var(--accent)')+'">'+(tot<0?'−':'')+'৳ '+formatMoney(Math.abs(tot))+'</b>';
  });
}
function openColumnSheet(col){
  const isEdit=!!col;
  sheet(isEdit?'Edit column':'New column', c=>{
    const row=el('div','row'); const inp=el('input','field'); inp.placeholder='Column name'; inp.value=isEdit?col.name:''; row.appendChild(inp); c.appendChild(row);

    let chosenType = isEdit ? col.type : 'text';
    const typeRow=el('div','modetoggle'); typeRow.style.margin='10px 0';
    [['text','Text'],['number','Number (adds to total)']].forEach(([v,label])=>{
      const b=el('button', chosenType===v?'on':''); b.textContent=label;
      b.onclick=()=>{ chosenType=v; typeRow.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
      typeRow.appendChild(b);
    });
    c.appendChild(typeRow);

    const save=el('button','primary'); save.textContent=isEdit?'Save column':'Add column';
    save.onclick=()=>{
      const name=inp.value.trim(); if(!name) return;
      editing.columns=editing.columns||[];
      if(isEdit){ col.name=name; col.type=chosenType; }
      else { editing.columns.push({id:uid(),name,type:chosenType}); (editing.items||[]).forEach(it=>{it.cells=it.cells||{};}); }
      scheduleSave(); closeSheet();
      const table=$('#sheettable'); if(table) drawSheetTable(table);
    };
    c.appendChild(save);

    if(isEdit){
      const del=el('button','danger'); del.style.marginTop='10px'; del.textContent='Delete column';
      let armed=false, armTimer=null;
      del.onclick=()=>{
        if(editing.columns.length<=1){ toast('Keep at least one column'); return; }
        if(!armed){
          armed=true; del.textContent='Tap again to confirm delete';
          armTimer=setTimeout(()=>{ armed=false; del.textContent='Delete column'; }, 3000);
          return;
        }
        clearTimeout(armTimer);
        editing.columns=editing.columns.filter(x=>x.id!==col.id);
        (editing.items||[]).forEach(it=>{ if(it.cells) delete it.cells[col.id]; });
        scheduleSave(); closeSheet();
        const table=$('#sheettable'); if(table) drawSheetTable(table);
        toast('Column deleted');
      };
      c.appendChild(del);
    }
  });
}
function drawSheetTable(table){
  const n=editing; ensureSheetSchema(n);
  const cols=n.columns;
  table.innerHTML='';
  table.style.gridTemplateColumns = '36px ' + cols.map(()=>'minmax(130px,1fr)').join(' ') + ' 44px';

  // header row
  table.appendChild(el('div','hcell handle'));
  cols.forEach(col=>{
    const h=el('div','hcell colhead');
    const label=el('span'); label.textContent = col.name + (col.type==='number' ? ' Σ' : '');
    const pencil=el('span','coledit');
    pencil.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
    h.appendChild(label); h.appendChild(pencil);
    h.onclick=()=>openColumnSheet(col);
    table.appendChild(h);
  });
  const addColBtn=el('div','hcell addcol');
  addColBtn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  addColBtn.onclick=()=>openColumnSheet(null);
  table.appendChild(addColBtn);

  // data rows
  (n.items||[]).forEach((it,idx)=>{
    it.cells=it.cells||{};
    const handle=el('div','cell handle');
    const del=el('button','rowdel');
    del.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
    del.onclick=()=>{ n.items.splice(idx,1); scheduleSave(); drawSheetTable(table); toast('Row deleted'); };
    handle.appendChild(del);
    table.appendChild(handle);
    cols.forEach(col=>{
      const cellWrap=el('div','cell');
      const inp=el('input', col.type==='number'?'num':'txt2');
      inp.value = it.cells[col.id] ?? '';
      inp.placeholder = col.name;
      let paintSign=()=>{};
      if(col.type==='number'){
        const sign=el('button','signtoggle'); sign.type='button';
        paintSign=()=>{
          const neg=String(it.cells[col.id]||'').trim().startsWith('-');
          sign.textContent = neg?'−':'+';
          sign.classList.toggle('neg', neg);
        };
        sign.onclick=(e)=>{
          e.preventDefault();
          let v=String(it.cells[col.id]||'').trim();
          if(v.startsWith('-')) v=v.slice(1); else if(v) v='-'+v;
          it.cells[col.id]=v; inp.value=v; paintSign(); scheduleSave(); updateSheetTotals(table);
        };
        cellWrap.appendChild(sign);
        paintSign();
      }
      inp.oninput=()=>{ it.cells[col.id]=inp.value; scheduleSave(); updateSheetTotals(table); paintSign(); };
      inp.onkeydown=e=>{
        if(e.key==='Enter'){
          e.preventDefault();
          const all=[...table.querySelectorAll('.cell input')];
          const i=all.indexOf(inp);
          if(all[i+1]) all[i+1].focus();
        }
      };
      cellWrap.appendChild(inp);
      table.appendChild(cellWrap);
    });
    table.appendChild(el('div','cell'));
  });

  // totals row (one sum per number-type column)
  if(cols.some(c=>c.type==='number')){
    const totLabel=el('div','cell totalrow handle'); totLabel.textContent='Total';
    table.appendChild(totLabel);
    cols.forEach(col=>{
      const c=el('div','cell totalrow');
      if(col.type==='number') c.dataset.col=col.id;
      table.appendChild(c);
    });
    table.appendChild(el('div','cell totalrow'));
    updateSheetTotals(table);
  }
}

function startOfDay(ts){const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime();}
function sparkline(vals){
  const w=52,h=20,max=Math.max(1,...vals),n=vals.length;
  const pts=vals.map((v,i)=>{const x=(n<2?0:(i/(n-1))*w); const y=h-(v/max)*(h-3)-1.5; return x.toFixed(1)+','+y.toFixed(1);}).join(' ');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" fill="none"><polyline points="'+pts+'" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/></svg>';
}
function statCard(ic,num,lb,grad,spark){
  return '<div class="stat" style="background:'+grad+'"><div class="ic">'+ic+'</div>'+(spark?'<div class="spark">'+spark+'</div>':'')+'<div class="num">'+num+'</div><div class="lb">'+lb+'</div></div>';
}
function renderDashboard(){
  const box=$('#dash'); if(!box) return;
  const active=notes.filter(n=>!n.deletedAt);
  const total=active.length, pinned=active.filter(n=>n.pinned).length, archived=active.filter(n=>n.archived).length;

  const today0=startOfDay(now()); const days=[]; const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  for(let i=6;i>=0;i--){ const d0=today0-i*86400000; const cnt=active.filter(n=>startOfDay(n.createdAt)===d0).length; days.push({label:DOW[new Date(d0).getDay()],count:cnt}); }
  const maxc=Math.max(1,...days.map(d=>d.count));

  const freq=tags.map(t=>({t,c:active.filter(n=>(n.tags||[]).includes(t.id)).length})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c);
  const maxf=Math.max(1,...freq.map(x=>x.c));
  const recent=active.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,5);

  let html='<div class="stats">';
  html+=statCard('📝',total,'Total notes','linear-gradient(135deg,var(--accent),var(--accent-2))',sparkline(days.map(d=>d.count)));
  html+=statCard('📌',pinned,'Pinned','linear-gradient(135deg,#f97316,#ec4899)');
  html+=statCard('🗂️',archived,'Archived','linear-gradient(135deg,#0ea5e9,#6366f1)');
  html+=statCard('🏷️',tags.length,'Tags','linear-gradient(135deg,#8b5cf6,#d946ef)');
  html+='</div>';

  html+='<div class="dash-sect"><h2>Last 7 days</h2><div class="bars">';
  days.forEach(d=>{ const h=d.count?Math.max(Math.round((d.count/maxc)*100),8):3; html+='<div class="bar"><span class="n">'+(d.count||'')+'</span><span class="fill" style="height:'+h+'%"></span><span class="d">'+d.label+'</span></div>'; });
  html+='</div></div>';

  html+='<div class="dash-sect"><h2>Tags</h2>';
  if(freq.length){ html+='<div class="cloud">'; freq.forEach(x=>{ const sz=13+Math.round((x.c/maxf)*13); html+='<button data-tag="'+x.t.id+'" style="background:'+x.t.color+';font-size:'+sz+'px">'+escapeHtml(x.t.name)+' <span style="opacity:.85">'+x.c+'</span></button>'; }); html+='</div>'; }
  else html+='<div class="dash-empty">No tagged notes yet.</div>';
  html+='</div>';

  html+='<div class="dash-sect"><h2>Recent</h2>';
  if(recent.length){ html+='<div class="recent">'; recent.forEach(n=>{ const prev=n.type==='text'?(n.content||'').replace(/<[^>]+>/g,' ').trim():((n.items||[]).map(i=>i.text).filter(Boolean).join(', ')); html+='<button class="rcard" data-open="'+n.id+'" style="border-left-color:'+(n.color||'var(--accent)')+'"><h4>'+escapeHtml(n.title||'Untitled')+'</h4><p>'+escapeHtml(prev||'Empty')+'</p></button>'; }); html+='</div>'; }
  else html+='<div class="dash-empty">No notes yet — add one from the Notes tab.</div>';
  html+='</div>';

  box.innerHTML=html;
  box.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{ filter.kind='active'; filter.tagId=b.dataset.tag; filter.folderId=null; $('#search').value=''; searchQ=''; switchTab('notes'); render(); });
  box.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openEditor(b.dataset.open));
}

function exportData(){
  const data={app:'notes',version:2,exportedAt:new Date().toISOString(),notes,folders,tags};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='notes-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('Backup downloaded');
}
async function importData(file){
  try{ const data=JSON.parse(await file.text()); await importParsed(data); }
  catch(e){ toast('Could not read that backup file'); }
}
async function importParsed(data){
  if(!data || !Array.isArray(data.notes)){ toast('Invalid backup file'); return; }
  (data.folders||[]).forEach(f=>{ if(f.id && !folders.find(x=>x.id===f.id)){ folders.push(f); DB.put('folders',f); } });
  (data.tags||[]).forEach(t=>{ if(t.id && !tags.find(x=>x.id===t.id)){ tags.push(t); DB.put('tags',t); } });
  let added=0,updated=0;
  data.notes.forEach(n=>{
    if(!n.id) return;
    const ex=notes.find(x=>x.id===n.id);
    if(!ex){ notes.push(n); DB.put('notes',n); added++; }
    else if((n.updatedAt||0)>(ex.updatedAt||0)){ Object.assign(ex,n); DB.put('notes',ex); updated++; }
  });
  closeSheet(); render();
  toast('Imported '+added+' new, '+updated+' updated');
}
function pickImportFile(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{ if(inp.files&&inp.files[0]) importData(inp.files[0]); };
  inp.click();
}

/* ---------- Google Drive backup (online only; needs the user's OAuth Client ID) ---------- */
let driveToken=null, driveTokenClient=null;
function loadGIS(){
  return new Promise((res,rej)=>{
    if(window.google && google.accounts && google.accounts.oauth2) return res();
    const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true; s.defer=true;
    s.onload=()=>res(); s.onerror=()=>rej(new Error('gis')); document.head.appendChild(s);
  });
}
function driveConnect(cb){
  const cid=(settings.driveClientId||'').trim();
  if(!cid){ toast('Add your Google Client ID first'); return; }
  loadGIS().then(()=>{
    driveTokenClient=google.accounts.oauth2.initTokenClient({
      client_id:cid,
      scope:'https://www.googleapis.com/auth/drive.file',
      callback:(resp)=>{ if(resp && resp.access_token){ driveToken=resp.access_token; cb(); } else toast('Google sign-in failed'); }
    });
    driveTokenClient.requestAccessToken({prompt: driveToken?'':'consent'});
  }).catch(()=>toast('Could not reach Google (are you online?)'));
}
async function driveFindFile(){
  const q=encodeURIComponent("name='notes-backup.json' and trashed=false");
  const r=await fetch('https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id,name)&q='+q,{headers:{Authorization:'Bearer '+driveToken}});
  const d=await r.json(); return (d.files&&d.files[0])||null;
}
function driveBackup(){
  driveConnect(async ()=>{
    try{
      const content=JSON.stringify({app:'notes',version:2,exportedAt:new Date().toISOString(),notes,folders,tags},null,2);
      const existing=await driveFindFile();
      let resp;
      if(existing){
        resp=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+existing.id+'?uploadType=media',{method:'PATCH',headers:{Authorization:'Bearer '+driveToken,'Content-Type':'application/json'},body:content});
      } else {
        const boundary='notes'+Date.now();
        const meta={name:'notes-backup.json',mimeType:'application/json'};
        const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+content+'\r\n--'+boundary+'--';
        resp=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+driveToken,'Content-Type':'multipart/related; boundary='+boundary},body});
      }
      toast(resp.ok?'Backed up to Drive':'Backup failed ('+resp.status+')');
    }catch(e){ toast('Backup failed'); }
  });
}
function driveRestore(){
  driveConnect(async ()=>{
    try{
      const f=await driveFindFile();
      if(!f){ toast('No backup found in your Drive'); return; }
      const r=await fetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media',{headers:{Authorization:'Bearer '+driveToken}});
      await importParsed(await r.json());
    }catch(e){ toast('Restore failed'); }
  });
}

    [['light','Light'],['dark','Dark']].forEach(([m,label])=>{ const b=el('button',settings.mode===m?'on':''); b.textContent=label; b.onclick=()=>{ settings.mode=m; applyTheme(); saveSettings(); modeRow.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }; modeRow.appendChild(b); });

    const l2=el('span','lab'); l2.style.cssText='font-size:12.5px;font-weight:700;color:var(--ink-soft)'; l2.textContent='Color theme'; c.appendChild(l2);

    c.appendChild(grid);

    const l3=el('span','lab'); l3.style.cssText='font-size:12.5px;font-weight:700;color:var(--ink-soft)'; l3.textContent='Backup (file)'; c.appendChild(l3);
    const exp=el('button','primary'); exp.textContent='Export all notes (.json)'; exp.onclick=exportData; c.appendChild(exp);

    const cidRow=el('div','row'); cidRow.style.margin='8px 0 4px'; const cid=el('input','field'); cid.placeholder='Google OAuth Client ID'; cid.value=settings.driveClientId||''; cid.oninput=()=>{ settings.driveClientId=cid.value.trim(); saveSettings(); }; cidRow.appendChild(cid); c.appendChild(cidRow);
    const help=el('div'); help.style.cssText='font-size:12px;color:var(--ink-soft);margin:0 2px 10px;line-height:1.5'; help.textContent='One-time setup, works online only. Paste your Client ID above (see the setup steps I gave you).'; c.appendChild(help);
    const bBk=el('button','primary'); bBk.textContent='Back up to Drive'; bBk.onclick=driveBackup; c.appendChild(bBk);
    const bRs=el('button','ghost'); bRs.textContent='Restore from Drive'; bRs.onclick=driveRestore; c.appendChild(bRs);
  });
}

/* =========================================================
   Calculator
========================================================= */
let calcExpr='', calcDone=false, calcReturnToNote=false, savedSel=null, lastItemField=null;
function calcEvaluate(raw){
  if(!raw) return '';
  let s=raw.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/[+\-*/]$/,'');
  if(!s) return '';
  const toks=[]; let i=0;
  while(i<s.length){
    const ch=s[i];
    if('+-*/'.includes(ch)){ toks.push(ch); i++; continue; }
    if(/[0-9.]/.test(ch)){
      let num=''; while(i<s.length && /[0-9.]/.test(s[i])){ num+=s[i]; i++; }
      let val=parseFloat(num); if(isNaN(val)) return 'Error';
      if(s[i]==='%'){ val=val/100; i++; }
      toks.push(val); continue;
    }
    if(ch==='%'){ i++; continue; }
    return 'Error';
  }
  const out=[],ops=[],prec={'+':1,'-':1,'*':2,'/':2};
  for(const t of toks){
    if(typeof t==='number') out.push(t);
    else{ while(ops.length && prec[ops[ops.length-1]]>=prec[t]) out.push(ops.pop()); ops.push(t); }
  }
  while(ops.length) out.push(ops.pop());
  const st=[];
  for(const t of out){
    if(typeof t==='number'){ st.push(t); continue; }
    const b=st.pop(),a=st.pop(); if(a===undefined||b===undefined) return 'Error';
    let r; if(t==='+')r=a+b; else if(t==='-')r=a-b; else if(t==='*')r=a*b; else { if(b===0) return '∞'; r=a/b; }
    st.push(r);
  }
  if(st.length!==1) return 'Error';
  let r=st[0]; if(!isFinite(r)) return '∞';
  r=Math.round((r+Number.EPSILON)*1e10)/1e10;
  return String(r);
}
function updateCalc(){
  const e=$('#calcExpr'), r=$('#calcRes'); if(!e) return;
  if(calcDone){ e.textContent=''; r.textContent=calcExpr||'0'; return; }
  e.textContent=calcExpr;
  const v=calcEvaluate(calcExpr);
  r.textContent=(calcExpr===''?'0':(v||'0'));
}
function calcPress(k){
  if(k==='AC'){ calcExpr=''; calcDone=false; }
  else if(k==='⌫'){ calcExpr=calcExpr.slice(0,-1); calcDone=false; }
  else if(k==='='){
    if(calcExpr==='') return;
    const r=calcEvaluate(calcExpr);
    if(r==='Error'||r==='∞'||r===''){ calcExpr=''; calcDone=true; $('#calcExpr').textContent=''; $('#calcRes').textContent=(r==='∞'?"Can't ÷ by 0":'Error'); return; }
    calcExpr=r; calcDone=true; updateCalc(); return;
  }
  else if('+−×÷'.includes(k)){ if(calcExpr==='') return; calcDone=false; const last=calcExpr.slice(-1); if('+−×÷'.includes(last)) calcExpr=calcExpr.slice(0,-1)+k; else calcExpr+=k; }
  else if(k==='%'){ if(/[0-9]$/.test(calcExpr)) calcExpr+='%'; }
  else if(k==='.'){ if(calcDone){ calcExpr='0.'; calcDone=false; } else { const seg=calcExpr.split(/[+−×÷%]/).pop(); if(!seg.includes('.')) calcExpr+=(seg===''?'0.':'.'); } }
  else { if(calcDone){ calcExpr=k; calcDone=false; } else calcExpr+=k; }
  updateCalc();
}
function openCalc(fromEditor){
  calcReturnToNote = !!(fromEditor && editing);
  const ov=el('div','overlay'); ov.id='calc';
  const ins = calcReturnToNote ? '<button id="calcInsert" style="margin-left:auto;background:var(--accent);color:#fff;font-weight:750;padding:9px 16px;border-radius:11px">Insert</button>' : '';
  ov.innerHTML='<div class="ed-head"><button class="back" id="calcBack"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><span style="font-weight:750;font-size:16px">Calculator</span>'+ins+'</div><div class="calc-wrap"><div class="calc-display"><div class="calc-expr" id="calcExpr"></div><div class="calc-res" id="calcRes">0</div></div><div class="calc-keys" id="calcKeys"></div></div>';
  document.body.appendChild(ov);
  $('#calcBack').onclick=()=>ov.remove();
  if(calcReturnToNote) $('#calcInsert').onclick=calcInsert;
  const KEYS=[['AC','util'],['⌫','util'],['%','util'],['÷','op'],['7','num'],['8','num'],['9','num'],['×','op'],['4','num'],['5','num'],['6','num'],['−','op'],['1','num'],['2','num'],['3','num'],['+','op'],['0','num zero'],['.','num'],['=','eq']];
  const keys=$('#calcKeys');
  KEYS.forEach(([label,cls])=>{ const b=el('button',cls); b.textContent=label; b.onclick=()=>calcPress(label); keys.appendChild(b); });
  calcExpr=''; calcDone=false; updateCalc();
}
function calcInsert(){
  const val = calcDone ? calcExpr : calcEvaluate(calcExpr);
  if(!val || val==='Error' || val==='∞'){ toast('Nothing to insert yet'); return; }
  const n=editing, ov=document.getElementById('calc');
  if(!n){ if(ov)ov.remove(); return; }
  if(n.type==='text'){
    if(ov)ov.remove();
    const rte=$('#rte');
    if(rte){
      rte.focus();
      const sel=window.getSelection();
      if(savedSel){ sel.removeAllRanges(); sel.addRange(savedSel); }
      else { const r=document.createRange(); r.selectNodeContents(rte); r.collapse(false); sel.removeAllRanges(); sel.addRange(r); }
      document.execCommand('insertText',false,val);
      n.content=rte.innerHTML; scheduleSave();
    }
  } else {
    if(lastItemField){ lastItemField.value=(lastItemField.value?lastItemField.value+' ':'')+val; lastItemField.dispatchEvent(new Event('input')); if(ov)ov.remove(); }
    else { n.items=n.items||[]; n.items.push({text:val,qty:'',price:'',done:false}); scheduleSave(); if(ov)ov.remove(); buildEditorBody(); }
  }
  toast('Inserted '+val);
}

$('#themebtn').onclick=openThemeSheet;

boot();
